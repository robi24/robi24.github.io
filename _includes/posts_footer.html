<script>
  // Set utterances theme based on current theme
  (function () {
    function getUtterancesTheme() {
      var theme = localStorage.getItem('theme') || 'auto';
      var utterancesTheme;

      if (theme === 'dark') {
        utterancesTheme = 'github-dark';
      } else if (theme === 'light') {
        utterancesTheme = 'github-light';
      } else {
        // Auto mode - check system preference
        if (
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        ) {
          utterancesTheme = 'github-dark';
        } else {
          utterancesTheme = 'github-light';
        }
      }
      return utterancesTheme;
    }

    var utterancesTheme = getUtterancesTheme();

    var script = document.createElement('script');
    script.src = 'https://utteranc.es/client.js';
    script.setAttribute('repo', 'robi24/robi24.github.io');
    script.setAttribute('issue-term', 'pathname');
    script.setAttribute('theme', utterancesTheme);
    script.setAttribute('crossorigin', 'anonymous');
    script.async = true;

    // Listen for utterances ready event
    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://utteranc.es') return;

      // When utterances loads, immediately update theme
      var iframe = document.querySelector('.utterances-frame');
      if (iframe) {
        var currentTheme = getUtterancesTheme();
        var message = {
          type: 'set-theme',
          theme: currentTheme,
        };
        iframe.contentWindow.postMessage(message, 'https://utteranc.es');
      }
    });

    var container = document.getElementById('utterances-container');
    if (container) {
      container.appendChild(script);
    }
  })();
</script>
<div id="utterances-container"></div>
